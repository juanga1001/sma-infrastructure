---
- name: Deploy operational safety net (backups + watchdog) on sma-ubuntu-2
  hosts: mt5_hosts
  gather_facts: false
  become: true

  vars:
    ops_dir: /opt/sma/bin
    backup_dir: /opt/sma/backups
    status_file: /opt/sma/lab/status.json
    retention_days: 30

  tasks:
    - name: Ensure ops directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ ops_dir }}"
        - "{{ backup_dir }}"
        - /opt/sma/lab

    - name: Create swapfile (OOM insurance for Wine terminal spikes)
      ansible.builtin.shell: |
        fallocate -l 4G /swapfile && chmod 600 /swapfile && mkswap /swapfile
      args:
        creates: /swapfile

    - name: Enable swap now
      ansible.builtin.shell: |
        swapon --show --noheadings | grep -q "^/swapfile" || swapon /swapfile
      changed_when: false

    - name: Persist swap across reboots
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"

    - name: Prefer RAM over swap (server workload)
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-sma-swappiness.conf
        content: "vm.swappiness=10\n"
        mode: "0644"

    - name: Apply swappiness now
      ansible.builtin.command: sysctl -w vm.swappiness=10
      changed_when: false

    - name: Default Docker log rotation for future containers
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {"max-size": "20m", "max-file": "3"},
            "live-restore": true
          }

    - name: Rotate existing container logs (covers long-lived terminals)
      ansible.builtin.copy:
        dest: /etc/logrotate.d/docker-containers
        mode: "0644"
        content: |
          /var/lib/docker/containers/*/*-json.log {
            daily
            rotate 3
            maxsize 100M
            missingok
            copytruncate
            compress
            delaycompress
          }

    # Backups are encrypted to an age PUBLIC key; the private half lives
    # only on the operator workstation (~/.sma/backup-age.key). The old
    # openssl passphrase sat next to the ciphertext on this host.
    - name: Write backup age recipients (public key only)
      ansible.builtin.copy:
        dest: /opt/sma/backup-age.pub
        content: "{{ backup_age_public_key }}"
        mode: "0644"

    - name: Ensure private ops output directory (never web-served)
      ansible.builtin.file:
        path: /opt/sma/ops
        state: directory
        mode: "0750"

    - name: Install age + rclone for encrypted off-host backups
      ansible.builtin.apt:
        name: [age, rclone, jq]
        state: present
        update_cache: true

    - name: Write watchdog environment
      ansible.builtin.copy:
        dest: /opt/sma/watchdog.env
        mode: "0600"
        content: |
          ENGINE_API_KEY={{ engine_api_key }}
          TELEGRAM_BOT_TOKEN={{ telegram_bot_token | default('') }}
          TELEGRAM_CHAT_ID={{ telegram_chat_id | default('') }}

    # Every ops script below is copied from the sma-portfolio-lab repo —
    # the SINGLE source. Inline heredocs here drifted behind the repo and a
    # routine re-run would have silently removed two incident-driven
    # watchdog checks (audit 2026-08-21).
    - name: Install backup script (from sma-portfolio-lab)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../sma-portfolio-lab/backend/scripts/backup.sh"
        dest: "{{ ops_dir }}/backup.sh"
        mode: "0755"

    - name: Install watchdog script (from sma-portfolio-lab)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../sma-portfolio-lab/backend/scripts/watchdog.sh"
        dest: "{{ ops_dir }}/watchdog.sh"
        mode: "0755"

    - name: Install parity check (from sma-portfolio-lab)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../sma-portfolio-lab/backend/scripts/parity_check.py"
        dest: "{{ ops_dir }}/parity_check.py"
        mode: "0644"

    - name: Install parity runner (from sma-portfolio-lab)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../sma-portfolio-lab/backend/scripts/parity.sh"
        dest: "{{ ops_dir }}/parity.sh"
        mode: "0755"

    - name: Schedule nightly parity check
      ansible.builtin.cron:
        name: sma-parity
        minute: "50"
        hour: "3"
        job: "{{ ops_dir }}/parity.sh >/dev/null 2>&1"

    - name: Install weekly comparison (from sma-portfolio-lab)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../sma-portfolio-lab/backend/scripts/weekly_report.py"
        dest: "{{ ops_dir }}/weekly_report.py"
        mode: "0644"

    - name: Install weekly comparison runner (from sma-portfolio-lab)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../sma-portfolio-lab/backend/scripts/weekly.sh"
        dest: "{{ ops_dir }}/weekly.sh"
        mode: "0755"

    - name: Schedule weekly comparison (Saturday morning)
      ansible.builtin.cron:
        name: sma-weekly-report
        minute: "0"
        hour: "8"
        weekday: "6"
        job: "{{ ops_dir }}/weekly.sh >/dev/null 2>&1"

    - name: Schedule nightly backup
      ansible.builtin.cron:
        name: sma-backup
        minute: "15"
        hour: "3"
        job: "{{ ops_dir }}/backup.sh >> {{ backup_dir }}/backup.log 2>&1"

    - name: Install weekend restart script (from sma-portfolio-lab)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../sma-portfolio-lab/backend/scripts/weekend_restart.sh"
        dest: "{{ ops_dir }}/weekend_restart.sh"
        mode: "0755"

    - name: Schedule weekend terminal+engine restart (Saturday, markets closed)
      ansible.builtin.cron:
        name: sma-weekend-restart
        minute: "37"
        hour: "9"
        weekday: "6"
        job: "{{ ops_dir }}/weekend_restart.sh >> /opt/sma/ops/weekend-restart.log 2>&1"

    - name: Schedule watchdog every 5 minutes
      ansible.builtin.cron:
        name: sma-watchdog
        minute: "*/5"
        job: "{{ ops_dir }}/watchdog.sh >/dev/null 2>&1"

    - name: Run the watchdog once now
      ansible.builtin.command: "{{ ops_dir }}/watchdog.sh"
      changed_when: true

    - name: Show status
      ansible.builtin.command: cat {{ status_file }}
      register: watchdog_status
      changed_when: false

    - name: Print watchdog status
      ansible.builtin.debug:
        msg: "{{ watchdog_status.stdout }}"
