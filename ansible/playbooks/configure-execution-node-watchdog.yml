---
- name: Configure SMA Execution Node watchdog
  hosts: execution_nodes
  gather_facts: false

  vars:
    watchdog_task_name: SMA-Execution-Node-Watchdog
    watchdog_script_path: C:\SMA\scripts\execution-node-watchdog.ps1
    execution_node_task_name: SMA-Execution-Node
    execution_node_env_path: C:\SMA\sma-execution-node\.env

  tasks:
    - name: Ensure SMA scripts directory exists
      ansible.windows.win_file:
        path: C:\SMA\scripts
        state: directory

    - name: Install Execution Node watchdog script
      ansible.windows.win_copy:
        src: ../scripts/execution-node-watchdog.ps1
        dest: "{{ watchdog_script_path }}"

    - name: Register Execution Node watchdog scheduled task
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $TaskName = "{{ watchdog_task_name }}"
          $ScriptPath = "{{ watchdog_script_path }}"
          $ExecutionUser = (Get-ScheduledTask -TaskName "{{ execution_node_task_name }}").Principal.UserId

          $Action = New-ScheduledTaskAction `
              -Execute "powershell.exe" `
              -Argument "-NoProfile -ExecutionPolicy Bypass -File `"$ScriptPath`" -EnvFilePath `"{{ execution_node_env_path }}`""

          # Task Scheduler rejects [TimeSpan]::MaxValue as repetition duration.
          $Trigger = New-ScheduledTaskTrigger `
              -Once `
              -At (Get-Date) `
              -RepetitionInterval (New-TimeSpan -Minutes 2) `
              -RepetitionDuration (New-TimeSpan -Days 3650)

          $Principal = New-ScheduledTaskPrincipal `
              -UserId $ExecutionUser `
              -LogonType S4U `
              -RunLevel Highest

          $Settings = New-ScheduledTaskSettingsSet `
              -AllowStartIfOnBatteries `
              -DontStopIfGoingOnBatteries `
              -StartWhenAvailable `
              -ExecutionTimeLimit ([TimeSpan]::Zero) `
              -MultipleInstances Queue

          Register-ScheduledTask `
              -TaskName $TaskName `
              -Action $Action `
              -Trigger $Trigger `
              -Principal $Principal `
              -Settings $Settings `
              -Description "Restarts SMA Execution Node API when local health checks fail and ensures MT5 terminals for active deployments are running." `
              -Force | Out-Null

          $RegisteredTask = Get-ScheduledTask -TaskName $TaskName -ErrorAction Stop
          Start-ScheduledTask -TaskName $TaskName

          $Ansible.Result = @{
              task = $TaskName
              script = $ScriptPath
              execution_user = $ExecutionUser
              state = $RegisteredTask.State.ToString()
          }

    - name: Verify watchdog scheduled task exists
      ansible.windows.win_powershell:
        script: |
          $Task = Get-ScheduledTask -TaskName "{{ watchdog_task_name }}" -ErrorAction Stop
          $Ansible.Result = @{
              task = $Task.TaskName
              state = $Task.State.ToString()
              user = $Task.Principal.UserId
              logon = $Task.Principal.LogonType.ToString()
          }

    - name: Print watchdog summary
      ansible.builtin.debug:
        msg: |-
          Execution Node Watchdog Configured
          Task: {{ watchdog_task_name }}
          Script: {{ watchdog_script_path }}
          Interval: every 2 minutes
          Checks:
            - http://localhost:8000/healthcheck
            - terminal64.exe process
