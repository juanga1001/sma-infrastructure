---
- name: Configure SMA Execution Node environment file
  hosts: execution_nodes
  gather_facts: false

  vars:
    execution_node_repo_path: C:\SMA\sma-execution-node
    execution_node_env_path: C:\SMA\sma-execution-node\.env
    execution_node_scripts_path: C:\SMA\scripts
    execution_node_env_script_path: C:\SMA\scripts\set-execution-node-env-value.ps1
    execution_node_mt5_path: 'C:\Program Files\MetaTrader 5\terminal64.exe'
    execution_node_mt5_terminal_template_dir: C:\SMA\MT5\_template
    execution_node_mt5_terminal_config_path: C:\SMA\mt5\sma-terminal.ini
    execution_node_account_connection_test_timeout_seconds: '300'
    execution_node_env_managed:
      MT5_PATH: '{{ execution_node_mt5_path }}'
      MT5_TERMINAL_TEMPLATE_DIR: '{{ execution_node_mt5_terminal_template_dir }}'
      MT5_TERMINAL_CONFIG_PATH: '{{ execution_node_mt5_terminal_config_path }}'
      ACCOUNT_CONNECTION_TEST_TIMEOUT_SECONDS: >-
        {{ execution_node_account_connection_test_timeout_seconds }}

  tasks:
    - name: Verify Execution Node repository exists
      ansible.windows.win_stat:
        path: "{{ execution_node_repo_path }}"
      register: execution_node_repo

    - name: Fail when Execution Node repository is missing
      ansible.builtin.assert:
        that:
          - execution_node_repo.stat.exists
          - execution_node_repo.stat.isdir
        fail_msg: >-
          Execution Node repository was not found at {{ execution_node_repo_path }}.
          Provision the repository before configuring its .env file.
        quiet: true

    - name: Ensure SMA scripts directory exists
      ansible.windows.win_file:
        path: "{{ execution_node_scripts_path }}"
        state: directory

    - name: Install Execution Node .env helper script
      ansible.windows.win_copy:
        src: ../scripts/set-execution-node-env-value.ps1
        dest: "{{ execution_node_env_script_path }}"

    - name: Ensure Execution Node .env file exists
      ansible.windows.win_copy:
        dest: "{{ execution_node_env_path }}"
        content: |
          # Managed in part by sma-infrastructure Ansible playbooks.
        force: false

    - name: Ensure managed values in Execution Node .env
      ansible.windows.win_powershell:
        script: |
          param(
              [string]$ScriptPath,
              [string]$EnvFilePath,
              [string]$Name,
              [string]$Value
          )

          $Result = & $ScriptPath `
              -EnvFilePath $EnvFilePath `
              -Name $Name `
              -Value $Value

          $Ansible.Result = $Result
        parameters:
          ScriptPath: "{{ execution_node_env_script_path }}"
          EnvFilePath: "{{ execution_node_env_path }}"
          Name: "{{ item.key }}"
          Value: "{{ item.value }}"
      loop: "{{ execution_node_env_managed | dict2items }}"
      register: execution_node_env_updates

    - name: Strip UTF-8 BOM from Execution Node .env when present
      ansible.windows.win_powershell:
        script: |
          param([string]$EnvFilePath)

          if (-not (Test-Path $EnvFilePath)) {
              $Ansible.Result = @{ bom_removed = $false }
              return
          }

          $Content = [System.IO.File]::ReadAllText($EnvFilePath)
          $Updated = $Content.TrimStart([char]0xFEFF)
          $Encoding = New-Object System.Text.UTF8Encoding $False
          [System.IO.File]::WriteAllText($EnvFilePath, $Updated, $Encoding)
          $Ansible.Result = @{
              bom_removed = ($Content.Length -ne $Updated.Length)
          }
        parameters:
          EnvFilePath: "{{ execution_node_env_path }}"

    - name: Print managed Execution Node .env summary
      ansible.builtin.debug:
        msg: |-
          Execution Node .env updated at {{ execution_node_env_path }}
          Managed keys:
          {% for item in execution_node_env_managed | dict2items %}
          - {{ item.key }}={{ item.value }}
          {% endfor %}

    - name: Disable legacy default MT5 scheduled task
      ansible.windows.win_powershell:
        script: |
          $TaskName = 'SMA-MT5-Terminal'
          $Task = Get-ScheduledTask -TaskName $TaskName -ErrorAction SilentlyContinue
          if ($null -eq $Task) {
              $Ansible.Result = @{ status = 'not_found' }
              return
          }

          if ($Task.State -eq 'Running') {
              Stop-ScheduledTask -TaskName $TaskName
              Start-Sleep -Seconds 3
          }

          Disable-ScheduledTask -TaskName $TaskName | Out-Null

          Get-Process -Name 'terminal64' -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.Path -and -not $_.Path.ToLower().StartsWith('C:\SMA\MT5'.ToLower())
              } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }

          $Ansible.Result = @{ status = 'disabled' }

    - name: Restart Execution Node scheduled task after .env update
      ansible.windows.win_powershell:
        script: |
          $TaskName = 'SMA-Execution-Node'
          $Task = Get-ScheduledTask -TaskName $TaskName -ErrorAction SilentlyContinue
          if ($null -eq $Task) {
              throw "Scheduled task not found: $TaskName"
          }
          if ($Task.State -eq 'Running') {
              Stop-ScheduledTask -TaskName $TaskName
              Start-Sleep -Seconds 3
          }
          $ApiProcesses = @(
              Get-CimInstance Win32_Process |
              Where-Object {
                  $_.CommandLine -like '*uvicorn*' -and
                  $_.CommandLine -like '*src.main:app*'
              }
          )
          foreach ($Process in $ApiProcesses) {
              Stop-Process -Id $Process.ProcessId -Force -ErrorAction SilentlyContinue
          }
          Start-ScheduledTask -TaskName $TaskName
          Start-Sleep -Seconds 10

    - name: Wait for Execution Node healthcheck after .env update
      ansible.windows.win_uri:
        url: http://localhost:8000/healthcheck
        method: GET
        return_content: true
        status_code: 200
      register: env_update_healthcheck
      until:
        - env_update_healthcheck.status_code is defined
        - env_update_healthcheck.status_code == 200
      retries: 12
      delay: 5
