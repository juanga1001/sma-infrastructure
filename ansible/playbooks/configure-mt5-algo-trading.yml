---
- name: Enable MetaTrader 5 algorithmic trading on the Execution Node
  hosts: execution_nodes
  gather_facts: false

  vars:
    mt5_task_name: SMA-MT5-Terminal
    execution_node_task_name: SMA-Execution-Node
    execution_node_repo_path: C:\SMA\sma-execution-node
    mt5_terminal_path: C:\Program Files\MetaTrader 5\terminal64.exe
    mt5_config_dir: C:\SMA\mt5
    mt5_config_path: C:\SMA\mt5\sma-terminal.ini
    mt5_max_bars: 1000000

  tasks:
    - name: Verify local Execution Node API key is configured
      ansible.builtin.assert:
        that:
          - execution_node_api_key is defined
          - execution_node_api_key | length > 0
          - execution_node_api_key != "CHANGE_ME"
        fail_msg: >-
          execution_node_api_key is missing. Configure it in the ignored local
          vault/execution-node.yml file.
        quiet: true

    - name: Verify MetaTrader 5 terminal executable exists
      ansible.windows.win_stat:
        path: "{{ mt5_terminal_path }}"
      register: mt5_terminal_executable

    - name: Fail when MetaTrader 5 terminal executable is missing
      ansible.builtin.assert:
        that:
          - mt5_terminal_executable.stat.exists
        fail_msg: >-
          MetaTrader 5 terminal was not found at {{ mt5_terminal_path }}.
        quiet: true

    - name: Ensure SMA MT5 configuration directory exists
      ansible.windows.win_file:
        path: "{{ mt5_config_dir }}"
        state: directory

    - name: Write SMA MT5 startup configuration with algo trading enabled
      ansible.windows.win_copy:
        dest: "{{ mt5_config_path }}"
        content: |
          [Common]
          KeepPrivate=1

          [Charts]
          MaxBars={{ mt5_max_bars | int }}

          [Experts]
          Enabled=1
          AllowLiveTrading=1
          AllowDllImport=0
          Account=0
          Profile=0

    - name: Update SMA-MT5-Terminal scheduled task to use managed config
      ansible.windows.win_powershell:
        script: |
          $TaskName = "{{ mt5_task_name }}"
          $Mt5Path = "{{ mt5_terminal_path }}"
          $ConfigPath = "{{ mt5_config_path }}"

          $Task = Get-ScheduledTask -TaskName $TaskName -ErrorAction SilentlyContinue
          if ($null -eq $Task) {
              throw "Scheduled task not found: $TaskName"
          }

          $Action = New-ScheduledTaskAction `
              -Execute $Mt5Path `
              -Argument "/config:`"$ConfigPath`""

          Set-ScheduledTask -TaskName $TaskName -Action $Action | Out-Null

    - name: Stop Execution Node API scheduled task
      ansible.windows.win_powershell:
        script: |
          $TaskName = "{{ execution_node_task_name }}"
          $Task = Get-ScheduledTask -TaskName $TaskName -ErrorAction SilentlyContinue
          if ($null -eq $Task) {
              throw "Scheduled task not found: $TaskName"
          }

          if ($Task.State -eq "Running") {
              Stop-ScheduledTask -TaskName $TaskName
              Start-Sleep -Seconds 3
          }

          $ApiProcesses = @(
              Get-CimInstance Win32_Process |
              Where-Object {
                  $_.CommandLine -like "*uvicorn*" -and
                  $_.CommandLine -like "*src.main:app*"
              }
          )
          foreach ($Process in $ApiProcesses) {
              Stop-Process -Id $Process.ProcessId -Force
          }

    - name: Restart MetaTrader 5 scheduled task
      ansible.windows.win_powershell:
        script: |
          $TaskName = "{{ mt5_task_name }}"
          $Task = Get-ScheduledTask -TaskName $TaskName -ErrorAction SilentlyContinue
          if ($null -eq $Task) {
              throw "Scheduled task not found: $TaskName"
          }

          if ($Task.State -eq "Running") {
              Stop-ScheduledTask -TaskName $TaskName
              Start-Sleep -Seconds 3
          }

          $Processes = @(Get-Process -Name "terminal64" -ErrorAction SilentlyContinue)
          foreach ($Process in $Processes) {
              Stop-Process -Id $Process.Id -Force
          }

          Start-ScheduledTask -TaskName $TaskName
          Start-Sleep -Seconds 10

          $Processes = @(Get-Process -Name "terminal64" -ErrorAction SilentlyContinue)
          if ($Processes.Count -eq 0) {
              throw "MetaTrader 5 did not start: terminal64.exe was not found."
          }

    - name: Enable MetaTrader algo trading toolbar toggle
      ansible.windows.win_powershell:
        script: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class NativeMethods {
              [DllImport("user32.dll", SetLastError=true)]
              public static extern bool PostMessage(IntPtr hWnd, uint Msg, IntPtr wParam, IntPtr lParam);
              [DllImport("user32.dll", SetLastError=true)]
              public static extern IntPtr GetAncestor(IntPtr hWnd, uint gaFlags);
          }
          "@

          function Test-Mt5AlgoTradingEnabled {
              Push-Location "{{ execution_node_repo_path }}"
              try {
                  $output = & py -3.11 -m poetry run python -c @"
          import MetaTrader5 as mt5

          if not mt5.initialize():
              raise SystemExit(2)

          terminal = mt5.terminal_info()
          enabled = bool(terminal and terminal.trade_allowed)
          print(1 if enabled else 0)
          mt5.shutdown()
          "@
                  return [int]::Parse($output.Trim()) -eq 1
              }
              finally {
                  Pop-Location
              }
          }

          if (Test-Mt5AlgoTradingEnabled) {
              $Ansible.Result = @{ already_enabled = $true }
              return
          }

          $process = Get-Process -Name "terminal64" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $process) {
              throw "MetaTrader 5 is not running."
          }

          $handle = $process.MainWindowHandle
          if ($handle -eq [IntPtr]::Zero) {
              throw "MetaTrader 5 main window handle is unavailable."
          }

          $mainWindow = [NativeMethods]::GetAncestor($handle, 2)
          [void][NativeMethods]::PostMessage(
              $mainWindow,
              0x0111,
              [IntPtr]32851,
              [IntPtr]::Zero
          )
          Start-Sleep -Seconds 2

          if (-not (Test-Mt5AlgoTradingEnabled)) {
              throw "MetaTrader algo trading is still disabled after toggle attempt."
          }

          $Ansible.Result = @{ already_enabled = $false }

    - name: Start Execution Node API scheduled task
      ansible.windows.win_powershell:
        script: |
          $TaskName = "{{ execution_node_task_name }}"
          Start-ScheduledTask -TaskName $TaskName
          Start-Sleep -Seconds 5

    - name: Wait for Execution Node health after enabling algo trading
      ansible.windows.win_uri:
        url: http://localhost:8000/health
        method: GET
        headers:
          X-API-Key: "{{ execution_node_api_key }}"
        return_content: true
        status_code: 200
      register: algo_trading_health_response
      until:
        - algo_trading_health_response.status_code is defined
        - algo_trading_health_response.status_code == 200
        - algo_trading_health_response.content is defined
        - (algo_trading_health_response.content | from_json).status == "ok"
        - (algo_trading_health_response.content | from_json).mt5_connected | bool
      retries: 18
      delay: 5
      no_log: true

    - name: Verify MetaTrader algo trading is enabled
      ansible.windows.win_powershell:
        script: |
          Push-Location "{{ execution_node_repo_path }}"
          try {
              $output = & py -3.11 -m poetry run python -c @"
          import MetaTrader5 as mt5

          if not mt5.initialize():
              raise SystemExit('initialize failed')

          terminal = mt5.terminal_info()
          enabled = bool(terminal and terminal.trade_allowed)
          print('enabled=' + ('1' if enabled else '0'))
          mt5.shutdown()
          "@
          }
          finally {
              Pop-Location
          }

          if ($output -notmatch 'enabled=1') {
              throw "MetaTrader algo trading is still disabled: $output"
          }

          $Ansible.Result = @{
              algo_trading_enabled = $true
          }

    - name: Print MT5 algo trading configuration summary
      ansible.builtin.debug:
        msg: |-
          MT5 Algo Trading Configuration
          ------------------------------
          Config file: {{ mt5_config_path }}
          Scheduled task: {{ mt5_task_name }}
          Algo trading enabled: true
          Result: OK
