---
- name: Provision MT5 Docker host
  hosts: mt5_hosts
  gather_facts: true
  become: true

  vars:
    docker_engine_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

  tasks:
    - name: Install base prerequisites (incl. Python Docker SDK for community.docker)
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - python3-docker
        state: present
        update_cache: true

    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker Engine
      ansible.builtin.apt:
        name: "{{ docker_engine_packages }}"
        state: present
        update_cache: true

    - name: Ensure Docker service is enabled and running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Capture installed Docker version
      ansible.builtin.command: docker --version
      changed_when: false
      register: docker_version

    - name: Print MT5 Docker host provisioning summary
      ansible.builtin.debug:
        msg: |-
          MT5 Docker Host Provisioned
          Host: {{ inventory_hostname }} ({{ ansible_host }})
          OS: {{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_architecture }})
          Docker: {{ docker_version.stdout }}
          Result: OK
