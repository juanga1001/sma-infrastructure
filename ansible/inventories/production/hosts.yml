---
# Production inventory template.
# Replace placeholders locally before testing connectivity.
# Do not commit real server addresses, usernames, passwords, or API keys.
all:
  children:
    execution_nodes:
      hosts:
        execution-node-01:
          ansible_host: YOUR_SERVER_IP
          ansible_user: YOUR_WINDOWS_USER
          ansible_connection: winrm
          ansible_winrm_transport: basic
          ansible_winrm_server_cert_validation: ignore
          ansible_port: 5986
