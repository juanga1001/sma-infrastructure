# SMA MT5 Linux container node secrets (orchestrator) — TEMPLATE.
# Copy to vault/mt5-node.yml and fill in. The real file is gitignored.
#
# Generate strong values with:  python3 -c "import secrets; print(secrets.token_hex(32))"

# Shared API key Portfolio Lab uses to call the orchestrator management API.
orchestrator_api_key: CHANGE_ME

# Secret used to sign short-lived VNC access tokens. Must match whatever mints
# tokens (the orchestrator) and, if a separate gateway is added, that gateway.
vnc_token_secret: CHANGE_ME
engine_api_key: "<64 hex chars — engine API key, distinct from the orchestrator key>"
portfolio_lab_postgres_password: "<postgres password>"
portfolio_lab_secret_key: "<app SECRET_KEY>"
portfolio_lab_superuser: "<admin email>"
portfolio_lab_superuser_password: "<strong random password>"
git_username: "<github user>"
git_token: "<github PAT, rotate on exposure>"
backup_age_public_key: "<age1... public key; private half stays on the operator workstation>"
telegram_bot_token: "<bot token>"
telegram_chat_id: "<chat id>"
